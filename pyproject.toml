[project]
name = "pyne-worker"
version = "0.4.0"
description = "Production-grade Python Cloudflare Worker — Pine Script evaluator via pynescript"
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynescript",
    "workers-py",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
pynescript = { path = "../../../pynescript", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "/mnt/data/home/jango/Git/pynescript",
]
asyncio_mode = "auto"