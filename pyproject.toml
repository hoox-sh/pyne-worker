[project]
name = "pyne-worker"
version = "0.10.0"
description = "PYNE edge evaluate on Cloudflare Workers — Python host for pynescript (alerts, libraries, cron, R2, realtime, chart timeframe)"
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynescript",
    "workers-py",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
pynescript = { path = "../pynescript", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../pynescript/src",
    "../pynescript",
]
asyncio_mode = "auto"